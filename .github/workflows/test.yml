name: Security and regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r server/requirements-windows.lock
      - run: python -m unittest discover -s server -p test_security_integration.py -v
      - run: python -m unittest discover -s server -p test_rotation.py -v
      - run: python -m unittest discover -s server -p test_context_fusion.py -v
      - run: python -m unittest discover -s server -p test_device_registry.py -v
      - run: python -m unittest discover -s server -p test_loopback_proxy_bypass.py -v
      - run: python -m unittest discover -s server -p test_sensor_proxy_bypass.py -v
      - run: python -m unittest discover -s server -p test_device_sensor.py -v
